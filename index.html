<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المحاسبة الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page-content { display: none; }
        .page-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <!-- 1. شاشة الدخول -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h1 class="text-3xl font-bold text-center mb-2">مرحباً بعودتك</h1>
            <p class="text-center text-slate-400 mb-6 text-sm">سجل دخولك أو أنشئ شركة جديدة</p>
            <div id="errorBox" class="hidden bg-red-500/20 text-red-400 p-3 rounded-lg text-sm text-center mb-4 font-bold"></div>
            <div class="space-y-4">
                <input type="email" id="email" class="w-full bg-slate-800/50 border border-slate-600 text-white rounded-xl px-4 py-3" placeholder="البريد الإلكتروني" dir="ltr">
                <input type="password" id="password" class="w-full bg-slate-800/50 border border-slate-600 text-white rounded-xl px-4 py-3" placeholder="كلمة المرور" dir="ltr">
                
                <!-- خيارات إضافية للشركة الجديدة -->
                <div id="companyFields" class="hidden space-y-3">
                    <input type="text" id="companyName" class="w-full bg-slate-800/50 border border-slate-600 text-white rounded-xl px-4 py-3" placeholder="اسم الشركة">
                    <input type="text" id="branchName" class="w-full bg-slate-800/50 border border-slate-600 text-white rounded-xl px-4 py-3" placeholder="اسم الفرع الرئيسي">
                </div>

                <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition">دخول</button>
                <button id="toggleRegisterBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition">تسجيل شركة جديدة</button>
            </div>
        </div>
    </div>

    <!-- 2. لوحة التحكم -->
    <div id="dashboardScreen" class="hidden min-h-screen bg-slate-900">
        <aside class="w-64 bg-slate-800 border-l border-slate-700 flex flex-col hidden md:flex fixed h-full right-0 top-0">
            <div class="h-16 flex items-center justify-center border-b border-slate-700 bg-slate-900/50">
                <span class="text-xl font-bold text-blue-500">نظامي المحاسبي</span>
            </div>
            <nav class="flex-1 overflow-y-auto py-4">
                <p class="px-4 text-xs font-bold text-slate-500 mb-2">العمليات</p>
                <a href="#" onclick="showPage('home', this)" class="menu-item bg-slate-700 text-blue-400 border-r-4 border-blue-500 flex items-center gap-3 px-4 py-3 text-sm font-semibold">الرئيسية</a>
                <a href="#" onclick="showPage('inventory', this)" class="menu-item text-slate-300 hover:bg-slate-700 flex items-center gap-3 px-4 py-3 text-sm font-semibold">المخزون (الأصناف)</a>
                <a href="#" onclick="showPage('customers', this)" class="menu-item text-slate-300 hover:bg-slate-700 flex items-center gap-3 px-4 py-3 text-sm font-semibold">العملاء</a>
                <a href="#" onclick="showPage('sales', this)" class="menu-item text-slate-300 hover:bg-slate-700 flex items-center gap-3 px-4 py-3 text-sm font-semibold">المبيعات (فواتير)</a>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <button id="logoutBtn" class="w-full bg-red-500/10 text-red-400 hover:bg-red-500/20 py-2 rounded-lg font-bold transition-colors">تسجيل خروج</button>
            </div>
        </aside>

        <main class="mr-0 md:mr-64 min-h-screen flex flex-col">
            <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">
                <h2 id="pageTitle" class="text-lg font-bold text-white">لوحة التحكم</h2>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-slate-400">مرحباً، <span id="userEmail" class="text-blue-400 font-bold">...</span></span>
                </div>
            </header>

            <div class="p-6">
                <!-- الرئيسية -->
                <div id="page-home" class="page-content active">
                    <div class="bg-slate-800 rounded-xl border border-slate-700 h-64 flex items-center justify-center text-slate-500">مرحباً بك في النظام.</div>
                </div>
                <!-- المخزون -->
                <div id="page-inventory" class="page-content">
                    <div class="bg-slate-800 rounded-xl p-8 text-center text-slate-400">شاشة المخزون (تم تجهيزها سابقاً)</div>
                </div>
                <!-- العملاء -->
                <div id="page-customers" class="page-content">
                    <div class="bg-slate-800 rounded-xl p-8 text-center text-slate-400">شاشة العملاء (تم تجهيزها سابقاً)</div>
                </div>
                <!-- المبيعات -->
                <div id="page-sales" class="page-content">
                    <div class="bg-slate-800 rounded-xl p-8 text-center text-slate-400">شاشة المبيعات (تم تجهيزها سابقاً)</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://wjdhikxuwootmsnztmgb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_6JNfXXpQLxlxSdyF4XWKng_ZYaNccSE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCompanyId = null;
        let isRegisterMode = false;

        const loginScreen = document.getElementById('loginScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const toggleRegisterBtn = document.getElementById('toggleRegisterBtn');
        const companyFields = document.getElementById('companyFields');
        const companyNameInput = document.getElementById('companyName');
        const branchNameInput = document.getElementById('branchName');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmailSpan = document.getElementById('userEmail');
        const errorBox = document.getElementById('errorBox');

        // تبديل وضع الدخول/التسجيل
        toggleRegisterBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            if(isRegisterMode) {
                companyFields.classList.remove('hidden');
                loginBtn.innerText = 'إنشاء شركة وتسجيل الدخول';
                toggleRegisterBtn.innerText = 'لديك حساب بالفعل؟ سجل دخول';
            } else {
                companyFields.classList.add('hidden');
                loginBtn.innerText = 'دخول';
                toggleRegisterBtn.innerText = 'تسجيل شركة جديدة';
            }
        });

        function showPage(pageId, element) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.remove('bg-slate-700', 'text-blue-400', 'border-r-4', 'border-blue-500');
                el.classList.add('text-slate-300');
            });
            if(element) {
                element.classList.remove('text-slate-300');
                element.classList.add('bg-slate-700', 'text-blue-400', 'border-r-4', 'border-blue-500');
            }
            const titles = { 'home': 'لوحة التحكم', 'inventory': 'المخزون', 'customers': 'العملاء', 'sales': 'المبيعات' };
            document.getElementById('pageTitle').innerText = titles[pageId];
        }

        // جلب الشركة الخاصة بالمستخدم
        async function fetchCompany() {
            const { data: { user } } = await supabase.auth.getUser();
            if(user) {
                const { data: profile } = await supabase.from('user_profiles').select('company_id').eq('id', user.id).single();
                if(profile) currentCompanyId = profile.company_id;
            }
        }

        // تسجيل الدخول / إنشاء شركة
        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if(!email || !password) { errorBox.innerText = "⚠️ اكتب الإيميل والباسورد!"; errorBox.classList.remove('hidden'); return; }
            errorBox.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerText = 'جاري المعالجة...';

            try {
                if(isRegisterMode) {
                    const companyName = companyNameInput.value.trim();
                    const branchName = branchNameInput.value.trim();
                    if(!companyName) throw new Error("اكتب اسم الشركة!");

                    // 1. إنشاء المستخدم
                    const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
                    if (authError) throw authError;

                    // 2. إنشاء الشركة
                    const { data: company, error: compError } = await supabase.from('companies').insert([{ name: companyName }]).select().single();
                    if (compError) throw compError;

                    // 3. ربط المستخدم بالشركة (user_profiles)
                    const { error: profileError } = await supabase.from('user_profiles').insert([{ id: authData.user.id, company_id: company.id, role: 'admin' }]);
                    if (profileError) throw profileError;

                    // 4. إنشاء الفرع الرئيسي
                    await supabase.from('branches').insert([{ company_id: company.id, name: branchName || 'الفرع الرئيسي' }]);

                    alert("✅ تم إنشاء الشركة بنجاح! جاري الدخول...");
                } else {
                    // تسجيل دخول عادي
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
                
                await checkSession();
            } catch (err) {
                errorBox.innerText = "❌ " + err.message;
                errorBox.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = isRegisterMode ? 'إنشاء شركة وتسجيل الدخول' : 'دخول';
            }
        });

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                userEmailSpan.innerText = session.user.email;
                await fetchCompany();
            } else {
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
            }
        }
        checkSession();

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            await checkSession();
        });
    </script>
</body>
</html>
