<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
    
    <h2>اختبار النظام</h2>
    
    <input type="email" id="email" placeholder="الإيميل" style="padding: 10px; margin: 10px;"><br>
    <input type="password" id="password" placeholder="الباسورد" style="padding: 10px; margin: 10px;"><br>
    
    <button id="loginBtn" style="padding: 10px 20px; font-size: 18px;">اضغط للدخول</button>

    <script>
        // أول ما الصفحة تفتح، هتظهر الرسالة دي عشان نتأكد إن الكود شغال
        alert("1. الكود اتقرأ بنجاح!");

        const supabase = window.supabase.createClient(
            'https://wjdhikxuwootmsnztmgb.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqZGhpa3h1d29vdG1zbnp0bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODg4NTksImV4cCI6MjEwODM2NDg1OX0.SQlTNUsdXHTw6ETUPVS6qpOXpQ50snHv9e0h-GPLzmE'
        );

        document.getElementById('loginBtn').addEventListener('click', async () => {
            alert("2. الزرار اشتغل!");
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            alert("3. جاري محاولة الدخول لـ Supabase...");

            // هنا بنجرب نسجل دخول
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("4. فشل الدخول: " + error.message);
            } else {
                alert("4. نجاح! إنت مسجل دخول.");
            }
        });
    </script>
</body>
</html>
