<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام المحاسبة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center h-screen">

    <!-- شاشة الدخول -->
    <div id="loginScreen" class="bg-white p-8 rounded-xl shadow-lg w-80 text-center">
        <h1 class="text-2xl font-bold mb-4">تسجيل الدخول</h1>
        <p id="msg" class="text-red-500 text-sm mb-2"></p>
        <input type="email" id="email" placeholder="الإيميل" class="w-full p-2 mb-3 border rounded" dir="ltr">
        <input type="password" id="password" placeholder="الباسورد" class="w-full p-2 mb-4 border rounded" dir="ltr">
        <button id="btn" class="bg-blue-600 text-white w-full p-2 rounded font-bold">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashScreen" class="hidden bg-white p-8 rounded-xl shadow-lg text-center">
        <h1 class="text-2xl font-bold text-green-600 mb-4">تم الدخول بنجاح!</h1>
        <p class="text-gray-600 mb-2">إنت الآن في لوحة التحكم.</p>
        <p id="userEmail" class="font-bold text-blue-600 mb-6"></p>
        <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded">تسجيل خروج</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://wjdhikxuwootmsnztmgb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqZGhpa3h1d29vdG1zbnp0bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODg4NTksImV4cCI6MjEwODM2NDg1OX0.SQlTNUsdXHTw6ETUPVS6qpOXpQ50snHv9e0h-GPLzmE';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const loginScreen = document.getElementById('loginScreen');
        const dashScreen = document.getElementById('dashScreen');
        const msg = document.getElementById('msg');

        document.getElementById('btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!email || !password) {
                msg.innerText = "اكتب الإيميل والباسورد!";
                return;
            }

            msg.innerText = "جاري المعالجة...";

            try {
                let { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    let signUp = await supabase.auth.signUp({ email, password });
                    if (signUp.error) throw new Error(signUp.error.message);
                    msg.innerText = "تم إنشاء الحساب! جرب تدخل تاني.";
                } else {
                    // نجاح
                    loginScreen.classList.add('hidden');
                    dashScreen.classList.remove('hidden');
                    document.getElementById('userEmail').innerText = email;
                }
            } catch (err) {
                msg.innerText = err.message;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            dashScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.getElementById('password').value = '';
            msg.innerText = "";
        });
    </script>
</body>
</html>
