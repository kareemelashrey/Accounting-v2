<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <!-- شاشة الدخول -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl relative text-center">
            <h1 class="text-3xl font-bold text-white mb-6">مرحباً بعودتك</h1>
            <button onclick="showDashboard()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">
                دخول تجريبي (للعرض فقط)
            </button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardScreen" class="hidden min-h-screen flex bg-slate-900">
        <aside class="w-64 bg-slate-800 border-l border-slate-700 flex flex-col hidden md:flex">
            <div class="h-16 flex items-center justify-center border-b border-slate-700 bg-slate-900/50">
                <span class="text-xl font-bold text-blue-500">نظامي المحاسبي</span>
            </div>
            <nav class="flex-1 py-4">
                <p class="px-4 text-xs font-bold text-slate-500 mb-2">العمليات</p>
                <a href="#" class="bg-slate-700 text-blue-400 border-r-4 border-blue-500 flex items-center gap-3 px-4 py-3 text-sm font-semibold">الرئيسية</a>
                <a href="#" class="text-slate-300 flex items-center gap-3 px-4 py-3 text-sm font-semibold">المبيعات</a>
                <a href="#" class="text-slate-300 flex items-center gap-3 px-4 py-3 text-sm font-semibold">الفواتير</a>
                <a href="#" class="text-slate-300 flex items-center gap-3 px-4 py-3 text-sm font-semibold">المخزون</a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col">
            <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center px-6">
                <h2 class="text-lg font-bold text-white">لوحة التحكم</h2>
            </header>
            <div class="p-6">
                <div class="bg-slate-800 rounded-xl border border-slate-700 h-64 flex items-center justify-center text-slate-500">
                    هنا ستظهر آخر الفواتير والعمليات
                </div>
            </div>
        </main>
    </div>

    <script>
        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('flex');
        }
    </script>
</body>
</html>
