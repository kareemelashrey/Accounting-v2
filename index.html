<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المحاسبة</title>
    <!-- تحميل المكتبات بشكل مباشر عشان نمنع مشاكل -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div id="loginScreen" class="bg-white p-8 rounded shadow-md w-80 text-center">
        <h2 class="text-xl font-bold mb-4">تسجيل الدخول</h2>
        <p id="msg" class="text-red-500 text-sm mb-2"></p>
        <input type="email" id="email" placeholder="الإيميل" class="w-full p-2 mb-3 border rounded" dir="ltr">
        <input type="password" id="password" placeholder="الباسورد" class="w-full p-2 mb-4 border rounded" dir="ltr">
        <button id="btn" class="bg-blue-600 text-white w-full p-2 rounded font-bold">دخول / إنشاء حساب</button>
    </div>

    <div id="dashScreen" style="display:none;" class="bg-white p-8 rounded shadow-md text-center">
        <h2 class="text-2xl text-green-600 font-bold mb-4">تم الدخول بنجاح!</h2>
        <p class="mb-4">إنت الآن في لوحة التحكم.</p>
        <button id="outBtn" class="bg-red-500 text-white px-4 py-2 rounded">خروج</button>
    </div>

    <script>
        window.onload = function() {
            const url = 'https://wjdhikxuwootmsnztmgb.supabase.co';
            const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqZGhpa3h1d29vdG1zbnp0bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODg4NTksImV4cCI6MjEwODM2NDg1OX0.SQlTNUsdXHTw6ETUPVS6qpOXpQ50snHv9e0h-GPLzmE';
            const supabase = window.supabase.createClient(url, key);

            document.getElementById('btn').addEventListener('click', async () => {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const msg = document.getElementById('msg');
                
                if(!email || !password) { msg.innerText = "اكتب البيانات!"; return; }
                msg.innerText = "جاري المعالجة...";

                try {
                    let { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        let { error: suberr } = await supabase.auth.signUp({ email, password });
                        if (suberr) throw new Error(suberr.message);
                        msg.innerText = "تم إنشاء الحساب، دوس دخول تاني.";
                    } else {
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('dashScreen').style.display = 'block';
                    }
                } catch (e) {
                    msg.innerText = e.message;
                }
            });

            document.getElementById('outBtn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                document.getElementById('dashScreen').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'block';
            });
        };
    </script>
</body>
</html>
