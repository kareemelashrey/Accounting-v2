<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="text-align: center; padding: 50px; font-family: sans-serif;">
    
    <h2>اختبار الدخول</h2>
    <p id="msg" style="color: blue; font-weight: bold;">جاري التحميل...</p>
    
    <input type="email" id="email" placeholder="الإيميل" style="padding: 10px; margin: 10px;"><br>
    <input type="password" id="password" placeholder="الباسورد" style="padding: 10px; margin: 10px;"><br>
    
    <button id="btn" style="padding: 15px 30px; font-size: 18px; background: blue; color: white; border: none; border-radius: 5px;">
        اضغط للدخول
    </button>

    <script>
        const url = 'https://wjdhikxuwootmsnztmgb.supabase.co';
        const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqZGhpa3h1d29vdG1zbnp0bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODg4NTksImV4cCI6MjEwODM2NDg1OX0.SQlTNUsdXHTw6ETUPVS6qpOXpQ50snHv9e0h-GPLzmE';
        const supabase = window.supabase.createClient(url, key);
        const msg = document.getElementById('msg');

        msg.innerText = "جاري التحميل... الكود شغال!";

        document.getElementById('btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            msg.innerText = "جاري محاولة الدخول...";
            msg.style.color = "orange";

            // هنا بنحاول نسجل دخول بس، مفيش إنشاء حساب
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                // لو فشل، هنكتب الخطأ بالظبط
                msg.innerText = "الخطأ: " + error.message;
                msg.style.color = "red";
            } else {
                // لو نجح
                msg.innerText = "تم الدخول بنجاح!";
                msg.style.color = "green";
                alert("مبروك! إنت مسجل دخول.");
            }
        });
    </script>
</body>
</html>
